services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - frontend_net

  web:
    build: .
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDPANDA_BROKERS=redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
      - TOPIC_NAME=visits-topic
    depends_on:
      redis:
        condition: service_healthy
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
      redpanda-3:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 1
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-1:9092
      - --rpc-addr internal://0.0.0.0:33145
      - --advertise-rpc-addr internal://redpanda-1:33145
      - --mode dev-container
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - backend_net

  redpanda-2:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 2
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-2:9092
      - --rpc-addr internal://0.0.0.0:33145
      - --advertise-rpc-addr internal://redpanda-2:33145
      - --seeds internal://redpanda-1:33145
      - --mode dev-container
    depends_on:
      - redpanda-1
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - backend_net

  redpanda-3:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: redpanda-3
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 3
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-3:9092
      - --rpc-addr internal://0.0.0.0:33145
      - --advertise-rpc-addr internal://redpanda-3:33145
      - --seeds internal://redpanda-1:33145
      - --mode dev-container
    depends_on:
      - redpanda-1
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - backend_net

  counter-worker:
    build: .
    command: ["python", "counter_worker.py"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDPANDA_BROKERS=redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
      - TOPIC_NAME=visits-topic
      - DLQ_TOPIC=visits-dlq
    depends_on:
      redis:
        condition: service_healthy
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
      redpanda-3:
        condition: service_healthy
    networks:
      - backend_net

  audit-worker:
    build: .
    command: ["python", "audit_worker.py"]
    environment:
      - REDPANDA_BROKERS=redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
      - TOPIC_NAME=visits-topic
    depends_on:
      redpanda-1:
        condition: service_healthy
      redpanda-2:
        condition: service_healthy
      redpanda-3:
        condition: service_healthy
    networks:
      - backend_net

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend_net

volumes:
  redis_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
